<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script - Inicializando</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #090d16;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(14, 165, 233, 0.15);
      position: relative;
    }

    /* Background image with gradient vignette */
    .bg-image {
      position: absolute;
      inset: 0;
      background-image: url('splash-bg.jpg');
      background-size: cover;
      background-position: center;
      filter: brightness(0.65) contrast(1.1);
      z-index: 1;
      transition: transform 10s ease-out;
    }

    body:hover .bg-image {
      transform: scale(1.03);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.4) 0%, rgba(9, 13, 22, 0.92) 85%);
      z-index: 2;
    }

    /* Window content container */
    .content {
      position: relative;
      z-index: 3;
      height: 100%;
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-app-region: drag;
    }

    /* Top branding */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-text h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .brand-text p {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* Hero Center Quote / Attention Grabber */
    .hero-box {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 20px 24px;
      margin: auto 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      animation: pulse-glow 3s infinite alternate ease-in-out;
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 10px rgba(56, 189, 248, 0.05); }
      100% { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 25px rgba(56, 189, 248, 0.2); }
    }

    .hero-box h2 {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-box p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* Status & Progress Footer */
    .footer {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #cbd5e1;
    }

    .status-text {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      animation: blink 1.2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    .version-tag {
      font-size: 11px;
      color: #64748b;
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 15%;
      background: linear-gradient(90deg, #0284c7 0%, #38bdf8 50%, #818cf8 100%);
      border-radius: 10px;
      transition: width 0.4s ease-out;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      position: relative;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: shimmer 1.8s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="brand-header"></div>

    <div class="hero-box">
      <h2>✨ Preparando o seu Workspace</h2>
      <p id="hero-desc">Carregando histórico do diário, categorias e sincronizando o ambiente...</p>
    </div>

    <div class="footer">
      <div class="status-row">
        <div class="status-text">
          <span class="status-dot"></span>
          <span id="status-label">Iniciando sistema...</span>
        </div>
        <span class="version-tag" id="version-label">v1.0.0</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <script>
    const statusLabel = document.getElementById('status-label');
    const progressFill = document.getElementById('progress-fill');

    if (window.electronAPI && window.electronAPI.onSplashStatus) {
      window.electronAPI.onSplashStatus((data) => {
        if (data.text) {
          statusLabel.textContent = data.text;
        }
        if (typeof data.progress === 'number') {
          progressFill.style.width = Math.min(100, Math.max(0, data.progress)) + '%';
        }
      });
    }
  </script>
</body>
</html>
